<html lang="de"><head><meta charset="utf-8">

<title>Exit-Coach – Konzeptstudie von Aida Đulić</title>
<meta name="description" content="Konzeptstudie: Ein Übungsraum für schwierige Trennungs- und Kündigungsgespräche. Von Aida Đulić.">

<style>
/* Layout: eine schmale, mobile Spalte; Coach-Bereiche petrol, Rollenspiel amber – klar getrennt. */
:root {
  --bg: #f6f7fb; --surface: #ffffff; --surface-2: #eef1f9; --ink: #16203a; --muted: #5a6580; --line: #e2e6f0;
  --accent: #d6288c; --accent-ink: #ffffff; --accent-text: #b0116f; --accent-soft: #fde7f3;
  --coach: #12295a; --coach-ink: #ffffff;
  --role: #b0116f; --role-soft: #f8f9fd; --role-head: #eef1f9; --role-line: #d5dcf2; --work: #c47a12;
  --danger: #b42318; --danger-soft: #fdecea; --warn-soft: #fff6db;
  --font: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Bricolage Grotesque", var(--font); --brand: "Syne", var(--display); --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1426; --surface: #141d36; --surface-2: #1b2744; --ink: #e8ecf8; --muted: #9aa6c4; --line: #2a3658;
  --accent: #e0479f; --accent-ink: #ffffff; --accent-text: #ff8fc9; --accent-soft: #3a1a30;
  --coach: #1b3a7a; --coach-ink: #ffffff;
  --role: #ff8fc9; --role-soft: #101a31; --role-head: #1b2744; --role-line: #2f3d66; --work: #e7a95a;
  --danger: #f97066; --danger-soft: #3a1d1a; --warn-soft: #36301a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1426; --surface: #141d36; --surface-2: #1b2744; --ink: #e8ecf8; --muted: #9aa6c4; --line: #2a3658;
  --accent: #e0479f; --accent-ink: #ffffff; --accent-text: #ff8fc9; --accent-soft: #3a1a30;
  --coach: #1b3a7a; --coach-ink: #ffffff;
  --role: #ff8fc9; --role-soft: #101a31; --role-head: #1b2744; --role-line: #2f3d66; --work: #e7a95a;
  --danger: #f97066; --danger-soft: #3a1d1a; --warn-soft: #36301a; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent-text); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top nav { max-width: 42rem; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; }
.wm { display: flex; flex-direction: column; line-height: 1.1; text-align: left; }
.wm b { font-family: var(--brand); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--coach); }
.wm b i { font-style: normal; color: var(--accent-text); }
.wm small { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wm b { color: var(--ink); } }
.navlinks { display: flex; gap: 2px; }
.navlinks button { background: none; border: 0; padding: 8px 10px; border-radius: 8px; color: var(--muted); cursor: pointer; font-size: 14px; }
.navlinks button:hover, .navlinks button[aria-current="page"] { background: var(--surface-2); color: var(--ink); }
main { max-width: 42rem; margin: 0 auto; padding: 20px 16px 96px; display: flex; flex-direction: column; gap: 20px; }

h1 { font-family: var(--display); font-weight: 800; color: var(--coach); font-size: 26px; line-height: 1.2; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h2 { font-size: 17px; margin: 0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) h1 { color: var(--ink); } }
p { margin: 0; }
.eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-text); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 0; min-width: 0; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 16px; border-radius: 12px; font-weight: 650; cursor: pointer; border: 1.5px solid var(--coach); color: var(--coach); background: var(--surface); text-align: center; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-height: 52px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn { color: var(--ink); border-color: var(--line); } :root:not([data-theme="light"]) .btn-primary { color: var(--accent-ink); border-color: var(--accent); } }
.btn-primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn-ghost { background: none; border-color: transparent; color: var(--muted); }
.btn-quiet { background: none; border-color: transparent; text-decoration: underline; text-underline-offset: 4px; min-height: 44px; font-weight: 600; font-size: 14px; }
.btn-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn-danger:hover:not(:disabled) { background: var(--danger-soft); }
.btn-block { width: 100%; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

label.lbl, .lbl { display: block; font-weight: 650; font-size: 14px; margin-bottom: 6px; }
.field { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 13px; font-size: 16px; outline: none; resize: vertical; }
.field:focus { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent); }
.field::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
.hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
.choice { display: grid; gap: 8px; }
.choice-3 { grid-template-columns: repeat(3, 1fr); }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 12px; font-weight: 650; font-size: 14px; cursor: pointer; text-align: left; }
.pill[aria-pressed="true"] { border-color: var(--coach); background: var(--coach); color: var(--coach-ink); }
.pill.diff { text-align: center; text-transform: capitalize; }
.pill.diff[aria-pressed="true"] { border-color: var(--coach); background: var(--coach); color: var(--coach-ink); }

.hero { background: linear-gradient(135deg, #12295a, #1b3a7a); color: #fff; border-radius: 20px; padding: 36px 20px; display: flex; flex-direction: column; gap: 14px; }
.hero h1 { color: #fff; font-size: 34px; line-height: 1.05; letter-spacing: -.02em; }
.hero .eyebrow { color: #c9d3f0; }
.lockline { display: flex; align-items: center; gap: 8px; }
.hero .lead { color: #d5dcf2; font-size: 16px; max-width: 28rem; }
.hero .dur { text-align: center; margin-top: -4px; }
.flow { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 13px; color: var(--muted); }
.flow li:not(:last-child)::after { content: "/"; margin-left: 8px; color: var(--line); }
.flow .first { color: var(--ink); font-weight: 650; }
.mic-wrap { position: relative; }
.mic-wrap .field { padding-right: 58px; resize: none; }
.mic { position: absolute; right: 8px; bottom: 8px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--coach); display: grid; place-items: center; cursor: pointer; padding: 0; }
.mic:disabled { opacity: .4; cursor: not-allowed; }
.mic[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mic { color: var(--ink); } :root:not([data-theme="light"]) .mic[aria-pressed="true"] { color: var(--accent-ink); } }
.voice-msg { color: var(--danger); font-size: 12px; margin-top: 4px; }
.ttsrow { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; font-size: 13px; }
.ttsrow input { width: 16px; height: 16px; accent-color: var(--accent); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
@media (min-width: 560px) { .steps { grid-template-columns: 1fr 1fr; } }
.steps li { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.num { flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }

.panel { border-radius: 20px; overflow: hidden; background: var(--surface); }
.panel-coach { border: 1px solid var(--line); }
.panel-coach > .ph { background: var(--coach); color: var(--coach-ink); }
.panel-fb { border: 1px solid var(--line); }
.panel-fb > .ph { background: var(--coach); color: var(--coach-ink); }
.ph { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 12px 18px; }
.ph .tag { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: #ffb3dc; }
.ph .t { font-size: 17px; font-weight: 650; }
.pb { padding: 16px; }

.panel-role { border: 1.5px solid var(--role-line); background: var(--role-soft); }
.panel-role > .ph { background: var(--role-head); color: var(--coach); border-bottom: 1px solid var(--role-line); }
.panel-role > .ph .tag { color: var(--coach); }
.panel-role { border-top: 3px solid var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .panel-role > .ph .tag { color: var(--ink); } }
.panel-role .ph .r { margin-left: auto; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--coach); text-transform: capitalize; padding: 2px 10px; border-radius: 99px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .panel-role > .ph { color: var(--ink); } }
.chat { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.bubble { max-width: 86%; padding: 9px 13px; border-radius: 16px; font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble .who { display: block; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; }
.me { align-self: flex-end; background: var(--coach); color: var(--coach-ink); border-bottom-right-radius: 5px; }
.me .who { color: #aab6dd; }
.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--role-line); border-bottom-left-radius: 5px; }
.them .who { color: var(--muted); }
.composer { border-top: 1px solid var(--role-line); background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 8px; }

.progress { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; }
.progress li { flex: 1; }
.progress .bar { height: 6px; border-radius: 6px; background: var(--line); }
.progress .done .bar { background: var(--coach); }
.progress .cur .bar { background: var(--accent); }
.progress .pl { display: none; font-size: 11px; color: var(--muted); margin-top: 4px; }
.progress .cur .pl { color: var(--ink); font-weight: 650; }
@media (min-width: 560px) { .progress .pl { display: block; } }

.fbsec { padding: 12px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.fbsec:first-child { border-top: 0; padding-top: 0; }
.fbh { display: flex; align-items: center; gap: 8px; }
.fbh h3 { margin: 0; font-size: 17px; font-weight: 650; color: var(--coach); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fbh h3 { color: var(--ink); } }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip { margin-left: auto; font-size: 11px; font-weight: 650; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
blockquote { margin: 0; padding-left: 12px; border-left: 2px solid var(--line); font-style: italic; }
.unv { font-style: normal; font-size: 12px; color: var(--danger); }
.alt { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-weight: 500; font-size: 17px; line-height: 1.4; }
.sub { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }
.btn-opt { flex-direction: column; align-items: flex-start; gap: 0; text-align: left; justify-content: center; min-height: 56px; }

.note { border-radius: 12px; padding: 11px 13px; font-size: 13px; }
.note-legal { background: var(--warn-soft); border: 1px solid var(--line); }
.note-err { background: var(--danger-soft); color: var(--danger); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.note-err span { flex: 1 1 12rem; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent-text); font-weight: 650; cursor: pointer; text-decoration: underline; }
.note-err .linkbtn { color: var(--danger); }
.banner { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 13px; font-size: 14px; }
.banner span { flex: 1 1 14rem; }
.spin { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 14px; }
.spin::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: rot .8s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin::before { animation: none; } }

.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; }
.item-main { display: flex; gap: 10px; align-items: flex-start; padding: 12px; }
.item-open { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.item-open b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-del { background: none; border: 0; color: var(--muted); padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 13px; }
.item-del:hover { background: var(--danger-soft); color: var(--danger); }
.confirm { border-top: 1px solid var(--line); background: color-mix(in srgb, var(--danger-soft) 60%, var(--surface)); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.confirm span { flex: 1 1 10rem; }
.confirm .btn { min-height: 36px; padding: 6px 12px; }
details.box { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 13px; font-size: 14px; }
details.box summary { cursor: pointer; font-weight: 650; }
details.more { border: 1px dashed var(--line); border-radius: 12px; }
details.more summary { cursor: pointer; padding: 12px 13px; font-weight: 650; font-size: 14px; }
details.more > div { border-top: 1px solid var(--line); padding: 13px; display: flex; flex-direction: column; gap: 14px; }
.transcript { margin: 8px 0 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.provider { display: flex; gap: 12px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; }
.provider.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.provider input { margin-top: 4px; accent-color: var(--accent); width: 16px; height: 16px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.badge { font-size: 11px; font-weight: 650; padding: 2px 6px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-text); }
.badge.off { background: var(--surface-2); color: var(--muted); text-decoration: line-through; }
.divider { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
.modal-card { width: 100%; max-width: 28rem; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-card ul { margin: 0; padding-left: 20px; }

/* Executive-Vorbereitung */
.pscen { display: block; padding: 14px 14px; width: 100%; } .pscen b { white-space: normal; } .pscen .small { display: block; margin-top: 2px; }
.pprog { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; } .pprog i { display: block; height: 100%; background: var(--accent); }
.pnav { display: flex; gap: 10px; } .pnav .btn { flex: 1; } .pnav .btn-primary { flex: 2; }
.pq { font-size: 17px; font-weight: 600; line-height: 1.4; }
.pline { font-size: 17px; font-style: italic; }
.alt { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.grill { border: 1.5px solid var(--accent); border-left-width: 5px; border-radius: 12px; background: var(--accent-soft); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; } .grill p { margin: 0; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; } .chk input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); }
.pscore { display: flex; gap: 16px; align-items: center; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
.pscore .num { font-family: var(--display); font-size: 44px; font-weight: 800; line-height: 1; color: var(--coach); }
.pscore.ok .num { color: #137a45; } .pscore.mid .num { color: var(--work); } .pscore.low .num { color: var(--danger); }
.pbars { display: flex; flex-direction: column; gap: 8px; } .pbar { display: grid; grid-template-columns: 9.5rem 1fr 2rem; gap: 10px; align-items: center; font-size: 13px; }
.pbar .track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; } .pbar .track i { display: block; height: 100%; background: var(--coach); } .pbar b { text-align: right; }
.psec { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; } .psec p { margin: 0; }
.pul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.pquote { margin: 0; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 12px 12px 0; } .pquote p { margin-top: 2px; white-space: pre-wrap; }
.psteps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; } .psteps p { margin-top: 2px; }
.pcard { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; } .pcard .eyebrow { font-size: 10px; }
.pcheck { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; } .pcheck label { display: flex; gap: 10px; align-items: flex-start; } .pcheck input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); }
.grill-ai { border-color: var(--coach); background: var(--surface-2); } .grill-ai .eyebrow { color: var(--coach); }
.prate { display: flex; gap: 8px; margin-top: 6px; } .prate .btn { flex: 1; min-height: 44px; }
.pact { display: flex; flex-wrap: wrap; gap: 8px; } .pact .btn { flex: 1 1 9rem; }
@media print { .top, .noprint, .mic, #modal-root { display: none !important; } body { background: #fff; } .psec, .pcard { break-inside: avoid; } main { max-width: none; } }

/* Auftritt */
.btn-onhero { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
.hero-split { gap: 22px; }
.hero-main { display: flex; flex-direction: column; gap: 14px; }
.preview { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; color: #fff; }
.preview .eyebrow { color: #c9d3f0; }
.pv-score { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pv-score b { font-family: var(--display); font-size: 18px; }
.pv-num { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; } .pv-num small { font-size: 13px; font-weight: 500; opacity: .75; }

function mockCounterpart(s, round) {

function mockFeedback(round) {
  const user = round.turns.filter((t) => t.role === "user").map((t) => t.content);
  const other = round.turns.filter((t) => t.role === "assistant").map((t) => t.content);
  const us = user.flatMap(sentences), fallback = user[0] || "—";
  const empathic = us.find((x) => /(verstehe|nachvollziehen|ich sehe|tut mir|danke|wichtig)/i.test(x));
  const clear = us.find((x) => /(entschieden|habe mich|werde|endet|steht fest)/i.test(x));
  const sq = empathic || clear || us[0] || fallback;
  const sk = empathic && sq === empathic ? "empathie" : "klarheit";
  const hedged = us.find((x) => x.match(HEDGES));
  const longest = [...us].sort((a, b) => b.length - a.length)[0];
  const iq = hedged || (longest !== sq ? longest : us[1]) || fallback;
  const rw = iq.replace(HEDGES, "").replace(/\s{2,}/g, " ").replace(/\s+([,.!?])/g, "$1").trim() || iq;
  const diff = other.find((l) => /(warum|wieso|nicht dein ernst|akzeptiere|prüfen|entschieden\?)/i.test(l)) || other.find((l) => l.includes("?")) || other[0] || "—";

    strength: { quote: sq, observation: sk === "empathie" ? "Du sprichst die Perspektive des Gegenübers an, ohne von deiner Entscheidung abzurücken." : "Du benennst die Entscheidung direkt – das schafft Klarheit, worum es geht.", skill: sk },

    alternative: { original: iq, rewrite: hedged ? rw : (sentences(rw)[0] || rw), why: "Kürzer und ohne Weichmacher – in deinen eigenen Worten." },

    legalNotice: "",

function pickProvider(s) {
  if (s.provider === "live" && !liveUsable()) throw { code: "not_granted" };
  return s.provider;
}
async function runInterview(s) {
  let out;
  if (pickProvider(s) === "live") {
    out = await sampleFn.json(interviewPromptText(s), { modelTier: s.tier || "default", cache: false });
  } else { await wait(500); out = mockInterview(s); }
  const qs = (Array.isArray(out?.questions) ? out.questions : [])
    .filter((q) => q && typeof q.question === "string" && q.question.trim())
    .slice(0, 5)
    .map((q, i) => ({ id: `q${i + 1}`, prime: PRIME[q.prime] ? q.prime : "purpose", question: q.question.trim(), why: String(q.why || "") }));
  if (!qs.length) throw { code: "invalid_json" };
  const u = s.setup;
  const legal = String(out.legalNotice || "").trim() || (mentionsLegal(u.situation, u.goal, u.difficultMoments, u.relationship) ? LEGAL_NOTICE : "");
  return { questions: qs, legalNotice: legal || null };
}
async function runCounterpart(s, round, onText, signal) {
  if (pickProvider(s) === "live") {
    const r = await sampleFn(counterpartPromptText(s, round), { modelTier: "quick", cache: false, signal, onText: ({ text }) => onText(text) });
    return r.text.trim().replace(/^GEGENÜBER:\s*/i, "").replace(/^["„]|["“]$/g, "");
  }
  const text = mockCounterpart(s, round);
  let acc = "";
  for (const w of (text.match(/[^ ]* ?/g) || []).filter(Boolean)) { if (signal?.aborted) throw { code: "cancelled" }; await wait(30); acc += w; onText(acc); }
  return text;
}
async function runFeedback(s, round, prevLines) {
  let out;
  if (pickProvider(s) === "live") {
    out = await sampleFn.json(feedbackPromptText(s, round, prevLines), { modelTier: s.tier || "default", cache: false });
  } else { await wait(600); out = mockFeedback(round); }
  const ok = (o, k) => o && typeof o[k] === "string" && o[k].trim();
  if (!ok(out?.strength, "quote") || !ok(out?.improvement, "quote") || !ok(out?.alternative, "rewrite") || !ok(out?.difficultMoment, "counterpartLine")) throw { code: "invalid_json" };
  const userT = round.turns.filter((t) => t.role === "user").map((t) => t.content);
  const otherT = round.turns.filter((t) => t.role === "assistant").map((t) => t.content);
  const skill = (x) => (SKILLS[x] ? x : "klarheit");
  const legal = String(out.legalNotice || "").trim() || (mentionsLegal(...userT, ...otherT) ? LEGAL_NOTICE : "");
  return {
    strength: { quote: out.strength.quote, observation: String(out.strength.observation || ""), skill: skill(out.strength.skill), quoteVerified: quoteAppearsIn(out.strength.quote, userT) },
    improvement: { quote: out.improvement.quote, observation: String(out.improvement.observation || ""), skill: skill(out.improvement.skill), quoteVerified: quoteAppearsIn(out.improvement.quote, userT) },
    alternative: { original: String(out.alternative.original || out.improvement.quote), rewrite: out.alternative.rewrite, why: String(out.alternative.why || "") },
    difficultMoment: { counterpartLine: out.difficultMoment.counterpartLine, whyDifficult: String(out.difficultMoment.whyDifficult || ""), lineVerified: otherT.length ? quoteAppearsIn(out.difficultMoment.counterpartLine, otherT) : false },
    legalNotice: legal || null,
  };
}

      <div class="choice choice-3">${Object.keys(DIFFICULTIES).map((d) => `<button type="button" class="pill diff" data-difficulty="${d}" aria-pressed="${f.difficulty === d}">${d}</button>`).join("")}</div>
      <p class="hint">${esc(DIFFICULTIES[f.difficulty])}</p></fieldset>
    <details class="more"${f.experience || f.writingSample ? " open" : ""}><summary>Erfahrungen &amp; Schreibprobe <span class="muted" style="font-weight:400">(optional)</span></summary><div>
      <div><label class="lbl" for="f-exp">Konkrete Erfahrungen mit ähnlichen Gesprächen</label><textarea id="f-exp" data-f="experience" rows="3" class="field" placeholder="Was lief schon einmal gut oder schwierig? Was hast du damals gesagt?">${esc(f.experience)}</textarea></div>
      <div><label class="lbl" for="f-sample">Schreibprobe</label><textarea id="f-sample" data-f="writingSample" rows="4" class="field" placeholder="z. B. eine E-Mail oder Nachricht von dir. Hilft, Vorschläge an deine Stimme anzupassen.">${esc(f.writingSample)}</textarea><p class="hint">Entferne Namen und vertrauliche Details, bevor du Text einfügst.</p></div>
    </div></details>
    <div id="form-legal">${legal ? legalBox() : ""}</div>
    ${ui.errors.form ? errBox(ui.errors.form) : ""}
    <div class="stack" style="gap:6px"><button type="submit" class="btn btn-primary btn-block">Weiter zu den Rückfragen</button>
      <p class="small muted" style="text-align:center">KI: ${esc(providerText(p, effectiveTier()))}</p></div>
  </form>`;
}

function progress(phase) {
  const idx = PHASE_STEP[phase];
  return `<ol class="progress" aria-label="Fortschritt">${STEP_ORDER.map((l, i) => `<li class="${i < idx ? "done" : i === idx ? "cur" : ""}"${i === idx ? ' aria-current="step"' : ""}><div class="bar"></div><span class="pl">${l}</span></li>`).join("")}</ol>`;
}

function viewSession() {
  const s = getSession(ui.id);
  if (!s) return `<div class="panel pb stack" style="border:1px solid var(--line)"><p>Diese Übung gibt es nicht mehr.</p><button class="btn btn-primary" data-go="form">Neue Übung</button></div>`;
  const eff = effectiveProvider(), effTier = effectiveTier();
  const mismatch = eff !== s.provider || (eff === "live" && effTier !== (s.tier || "default"));
  const liveGone = s.provider === "live" && !liveUsable();
  return `
  <header class="stack" style="gap:10px">
    <div><p class="eyebrow" style="letter-spacing:.02em;text-transform:none;font-size:13px">${esc(SCENARIOS[s.setup.scenario])}</p><h1 style="font-size:21px">${esc(s.title)}</h1></div>
    ${progress(s.phase)}
    <p class="small muted">KI: ${esc(providerText(s.provider, s.tier))}</p>
    ${liveGone ? `<div class="banner"><span>Die KI ist nicht eingerichtet (API-Schlüssel fehlt).</span><button class="linkbtn" data-act="switch-mock">Mit Mock fortfahren</button></div>`
      : mismatch ? `<div class="banner"><span>In den Einstellungen ist <b>${esc(providerText(eff, effTier))}</b> gewählt.</span><button class="linkbtn" data-act="switch-settings">Für diese Übung wechseln</button></div>` : ""}
  </header>
  ${phaseView(s)}`;
}

function phaseView(s) {
  switch (s.phase) {
    case "interview": return viewInterview(s);
    case "opening": return viewOpening(s);
    case "roleplay": case "repeat": return viewRoleplay(s);
    case "feedback": case "repeat-feedback": return viewFeedbackStep(s);
    case "next-step": return viewNextStep(s);
    case "done": return viewDone(s);
  }
  return "";
}

function viewInterview(s) {
  let body = "";
  if (ui.busy.interview) body += spinner(s.provider === "live" ? "Der Coach liest deine Angaben … (kann bis zu einer Minute dauern)" : "Der Coach liest deine Angaben …");
  if (ui.errors.interview) body += errBox(ui.errors.interview, "retry-interview");
  if (s.interview) {
    body += `<div class="stack-lg"><p class="small muted">Beantworte, was du weißt – alles ist optional. Je konkreter, desto realistischer wird die Übung.</p>
      ${s.interview.questions.map((q) => `<div><label for="a-${q.id}" style="display:block">
        <span class="eyebrow" style="font-size:11px">${esc(PRIME[q.prime])}</span>
        <b style="display:block;margin-top:2px">${esc(q.question)}</b>${q.why ? `<span class="small muted" style="display:block">${esc(q.why)}</span>` : ""}</label>
        <textarea id="a-${q.id}" data-answer="${q.id}" rows="2" class="field" style="margin-top:8px">${esc(s.answers[q.id] || "")}</textarea></div>`).join("")}
      ${s.interview.legalNotice ? legalBox(s.interview.legalNotice) : ""}
      <button class="btn btn-primary btn-block" data-act="to-opening">Weiter zum Gesprächseinstieg</button></div>`;
  } else if (!ui.busy.interview && !ui.errors.interview) {
    body += `<div class="stack"><p>Der Coach stellt dir jetzt ein paar gezielte Fragen zu deiner Situation.</p><button class="btn btn-primary" data-act="retry-interview">Rückfragen holen</button></div>`;
  }
  return coachPanel("Ein paar Rückfragen", body);
}

function viewOpening(s) {
  const retry = s.rounds.length > 0;
  const lastFb = s.rounds[s.rounds.length - 1]?.feedback;
  return coachPanel(retry ? "Noch einmal üben" : "Dein Gesprächseinstieg", `<div class="stack-lg">
    <p>Schreib die ersten ein, zwei Sätze so, wie du sie wirklich sagen würdest. Der Coach formuliert sie bewusst nicht für dich.</p>
    <ul class="small muted" style="margin:0;padding-left:18px"><li>Kommt die Kernbotschaft früh?</li><li>Ist klar, ob die Entscheidung feststeht?</li><li>Klingt es nach dir?</li></ul>
    ${retry && lastFb ? `<p class="note" style="background:var(--accent-soft)">Letzter Verbesserungspunkt: ${esc(lastFb.improvement.observation)}</p>` : ""}
    <div><label class="lbl" for="opening">Dein Einstieg</label><div class="mic-wrap"><textarea id="opening" data-opening rows="4" class="field" style="resize:none" placeholder="Ich beginne mit …">${esc(s.openingDraft ?? s.opening)}</textarea>${micBtn("opening")}</div><p class="hint">${VOICE_HINT}</p></div>
    <fieldset style="border:0;padding:0;margin:0"><legend class="lbl">Schwierigkeit</legend>
      <div class="choice choice-3">${Object.keys(DIFFICULTIES).map((d) => `<button type="button" class="pill diff" data-sdiff="${d}" aria-pressed="${s.setup.difficulty === d}">${d}</button>`).join("")}</div></fieldset>
    <button class="btn btn-primary btn-block" data-act="start-roleplay" id="start-rp"${(s.openingDraft ?? s.opening).trim() ? "" : " disabled"}>Rollenspiel starten</button>
  </div>`);
}

function bubble(t, who, id) {
  const me = t.role === "user";
  return `<div class="bubble ${me ? "me" : "them"}"${id ? ` id="${id}"` : ""}><span class="who">${me ? "Du" : esc(who)}</span><span class="txt">${esc(t.content)}</span></div>`;
}

function viewRoleplay(s) {
  const round = s.rounds[s.rounds.length - 1];
  const repeat = round.kind === "wiederholung";
  const who = s.setup.counterpartLabel || "Gegenüber";
  const userTurns = round.turns.filter((t) => t.role === "user").length;
  const awaiting = round.turns[round.turns.length - 1]?.role === "user";
  const streaming = ui.streaming !== null;
  const canEnd = !streaming && userTurns >= 1 && (repeat || round.turns.some((t) => t.role === "assistant"));
  return `<section class="panel panel-role">
    <div class="ph"><span class="tag">Rollenspiel</span><span class="t">${repeat ? "Wiederholung des schwierigen Moments" : `Du sprichst mit: ${esc(who)}`}</span><span class="r">Schwierigkeit: ${esc(s.setup.difficulty)}</span></div>
    <p class="small muted" style="padding:8px 16px 0">${esc(DIFFICULTIES[s.setup.difficulty])} · Die KI spielt nur das Gegenüber, ohne Kommentare.</p>
    ${TTS ? `<label class="ttsrow"><input type="checkbox" data-tts${ui.tts ? " checked" : ""}> Antworten von ${esc(who)} vorlesen</label>` : ""}
    <div class="chat" id="chat">
      ${round.turns.map((t) => bubble(t, who)).join("")}
      ${streaming ? bubble({ role: "assistant", content: ui.streaming || (s.provider === "live" ? "denkt nach …" : "…") }, who, "stream-bubble") : ""}
      ${ui.errors.roleplay ? errBox(ui.errors.roleplay, "retry-reply") : ""}
    </div>
    <form class="composer" id="rp-form">
      <label for="rp-input" class="sr">Deine Antwort</label>
      <div class="mic-wrap"><textarea id="rp-input" rows="2" class="field" style="resize:none" placeholder="${awaiting ? "Warte auf die Antwort …" : "Was sagst du?"}"${streaming || userTurns >= MAX_USER_TURNS ? " disabled" : ""}>${esc(s.chatDraft || "")}</textarea>${micBtn("rp-input", streaming || userTurns >= MAX_USER_TURNS)}</div>
      <p class="hint">${VOICE_HINT}</p>
      <button type="submit" class="btn btn-primary btn-block" id="rp-send" style="font-size:16px"${streaming || awaiting || !(s.chatDraft || "").trim() ? " disabled" : ""}>Senden</button>
      <button type="button" class="btn btn-quiet" data-act="end-roleplay" style="align-self:center"${canEnd ? "" : " disabled"}>${repeat ? "Kurzfeedback" : "Beenden &amp; Feedback"}</button>
      ${streaming && s.provider === "live" ? `<button type="button" class="linkbtn small" data-act="stop-stream" style="align-self:center">Antwort abbrechen</button>` : ""}
      ${userTurns >= 6 ? `<p class="hint" style="text-align:center">${userTurns >= MAX_USER_TURNS ? "Maximale Länge erreicht – hol dir jetzt Feedback." : "Guter Zeitpunkt für Feedback."}</p>` : ""}
    </form></section>`;
}

function feedbackView(fb, title) {
  const q = (t, v) => `<blockquote>„${esc(t)}“${v ? "" : ` <span class="unv" title="Im Transkript nicht wörtlich gefunden">(nicht wörtlich belegt)</span>`}</blockquote>`;
  return `<section class="panel panel-fb"><div class="ph"><span class="tag">Coach</span><span class="t">${esc(title)}</span></div><div class="pb">
    <div class="fbsec"><div class="fbh"><span class="dot" style="background:var(--coach)"></span><h3>Stärke</h3><span class="chip">${esc(SKILLS[fb.strength.skill])}</span></div>${q(fb.strength.quote, fb.strength.quoteVerified)}<p>${esc(fb.strength.observation)}</p></div>
    <div class="fbsec"><div class="fbh"><span class="dot" style="background:var(--work)"></span><h3>Verbesserungspunkt</h3><span class="chip">${esc(SKILLS[fb.improvement.skill])}</span></div>${q(fb.improvement.quote, fb.improvement.quoteVerified)}<p>${esc(fb.improvement.observation)}</p></div>
    <div class="fbsec"><div class="fbh"><span class="dot" style="background:var(--accent)"></span><h3>Alternative Formulierung</h3></div><p class="small muted">Statt: „${esc(fb.alternative.original)}“</p><p class="alt">„${esc(fb.alternative.rewrite)}“</p>${fb.alternative.why ? `<p class="small muted">${esc(fb.alternative.why)}</p>` : ""}</div>
    <div class="fbsec"><div class="fbh"><span class="dot" style="background:var(--work)"></span><h3>Schwieriger Moment</h3></div><p>Gegenüber: <em>„${esc(fb.difficultMoment.counterpartLine)}“</em></p>${fb.difficultMoment.whyDifficult ? `<p class="small muted">${esc(fb.difficultMoment.whyDifficult)}</p>` : ""}</div>
    ${fb.legalNotice ? legalBox(fb.legalNotice) : ""}
  </div><p class="small muted" style="border-top:1px solid var(--line);padding:8px 16px">Das Feedback bewertet deine Aussagen. Reaktionen des Gegenübers sind simuliert und keine Aussagen über echte Gefühle.</p></section>`;
}

const transcriptHtml = (round, who) => `<ol class="transcript">${round.turns.map((t) => `<li><b style="${t.role === "user" ? "" : "color:var(--role)"}">${t.role === "user" ? "Du" : esc(who || "Gegenüber")}:</b> ${esc(t.content)}</li>`).join("")}</ol>`;

function viewFeedbackStep(s) {
  const round = s.rounds[s.rounds.length - 1];
  const repeat = round.kind === "wiederholung";
  return `<div class="divider">Rollenspiel beendet</div>
    <details class="box"><summary>Transkript ansehen (${round.turns.length} Beiträge)</summary>${transcriptHtml(round, s.setup.counterpartLabel)}</details>
    ${ui.busy.feedback ? spinner(s.provider === "live" ? "Der Coach wertet deine Aussagen aus … (kann bis zu einer Minute dauern)" : "Der Coach wertet deine Aussagen aus …") : ""}
    ${ui.errors.feedback ? errBox(ui.errors.feedback, "retry-feedback") : ""}
    ${round.feedback ? `${feedbackView(round.feedback, repeat ? "Kurzfeedback zur Wiederholung" : "Feedback")}
      <div class="stack" style="gap:8px"><button class="btn btn-primary btn-block" data-act="to-next" style="font-size:16px">Nächsten Schritt festlegen</button>
      <p class="eyebrow muted" style="color:var(--muted);margin-top:6px">Weiter üben</p>
      <button class="btn btn-opt" data-act="repeat-moment"><span>${repeat ? "Moment noch einmal üben" : "Schwierigen Moment wiederholen"}</span><span class="sub">Nur die Stelle mit der schwierigen Rückfrage</span></button>
      <button class="btn btn-opt" data-act="to-opening" style="border-color:var(--line)"><span>Noch einmal üben</span><span class="sub">Neuen Einstieg formulieren und das Gespräch neu starten</span></button></div>` : ""}`;
}

function viewNextStep(s) {
  return coachPanel("Dein Schritt für das echte Gespräch", `<div class="stack">
    <p>Was nimmst du dir konkret vor? Formuliere einen Schritt, den du vor oder im echten Gespräch umsetzt.</p>
    <p class="small muted">Hilfreich ist ein Schritt, der beobachtbar ist – mit Zeitpunkt oder Auslöser.</p>
    <label class="sr" for="next-step">Mein nächster Schritt</label>
    <textarea id="next-step" data-next rows="3" class="field">${esc(s.nextDraft ?? s.nextStep ?? "")}</textarea>
    <button class="btn btn-primary btn-block" data-act="save-next" id="save-next"${(s.nextDraft ?? s.nextStep ?? "").trim() ? "" : " disabled"}>Festlegen</button></div>`);
}

function viewDone(s) {
  const last = [...s.rounds].reverse().find((r) => r.feedback);
  return coachPanel("Geschafft", `<div class="stack-lg">
      <div><p class="eyebrow" style="font-size:11px">Dein nächster Schritt</p><p style="font-size:17px;font-weight:650;margin-top:4px">${esc(s.nextStep)}</p></div>
      <div><p class="eyebrow" style="font-size:11px;color:var(--muted)">Dein Einstieg</p><p style="margin-top:4px">„${esc(s.opening)}“</p></div>
      ${last ? `<div><p class="eyebrow" style="font-size:11px;color:var(--muted)">Alternative aus dem Feedback</p><p style="margin-top:4px">„${esc(last.feedback.alternative.rewrite)}“</p></div>` : ""}
      <div class="row"><button class="btn btn-primary" data-act="to-opening">Noch einmal üben</button><button class="btn" data-act="to-next">Schritt ändern</button></div></div>`) + `
    <section class="stack"><h2>Alle Übungen dieser Sitzung</h2>
      ${s.rounds.map((r, i) => `<details class="box"><summary>${i + 1}. ${r.kind === "wiederholung" ? "Wiederholung" : "Übung"}</summary>${transcriptHtml(r, s.setup.counterpartLabel)}${r.feedback ? `<div style="margin-top:12px">${feedbackView(r.feedback, "Feedback")}</div>` : ""}</details>`).join("")}
    </section>
    <button class="btn btn-ghost" data-go="home">Zur Startseite</button>`;
}

function viewHistory() {
  const list = [...memSessions].sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));
  return `<div class="stack" style="gap:6px"><h1>Gesprächsverlauf</h1><p class="small muted">Gespeichert nur in diesem Browser. Gelöschte Übungen lassen sich nicht wiederherstellen.</p></div>
  ${!list.length ? `<div class="panel pb stack" style="border:1px solid var(--line);text-align:center"><p class="muted">Noch keine Übungen gespeichert. Deine erste Übung erscheint hier, sobald du das Formular abschickst.</p><button class="btn btn-primary" data-go="form">Gespräch üben</button></div>` : `
    ${sessionList(list, true)}
    <div style="border-top:1px solid var(--line);padding-top:18px">
      ${!ui.confirmAll ? `<button class="btn btn-danger" data-act="ask-all">Gesamten Verlauf löschen</button>` : `
      <div class="panel pb stack" style="border:1px solid var(--danger)"><b>Alle ${list.length} Übungen endgültig löschen?</b>
        <div class="row"><button class="btn" data-act="cancel-all">Abbrechen</button><button class="btn btn-danger" data-act="del-all">Alles löschen</button></div></div>`}
    </div>`}`;
}

function viewSettings() {
  const sel = effectiveProvider();
  const v = memSettings.vendor || "anthropic";
  const card = (id, label, line, disabled) => `<label class="provider${sel === id ? " sel" : ""}"><input type="radio" name="prov" value="${id}"${sel === id ? " checked" : ""}${disabled ? " disabled" : ""}><div style="min-width:0"><b>${esc(label)}</b><p class="small muted">${esc(line)}</p></div></label>`;
  return `<div class="stack" style="gap:6px"><h1>Einstellungen</h1><p class="small muted">Wähle, wer Coach und Gegenüber spielt. Die Wahl gilt für neue Übungen; bei laufenden Übungen wirst du vor einem Wechsel gefragt.</p></div>
  <fieldset class="stack" style="border:0;padding:0;margin:0"><legend class="lbl">Anbieter</legend>
    ${card("live", PROVIDERS.live.label, liveUsable() ? `Echte KI: ${providerText("live", effectiveTier())}. Deine Eingaben gehen direkt an den Anbieter.` : "Erst einrichten: Anbieter, Modell und API-Schlüssel unten eintragen.", !liveUsable())}
    ${card("mock", PROVIDERS.mock.label, "Regelbasierte Beispielantworten. Keine Daten verlassen deinen Browser. Gut zum Ausprobieren.", false)}
  </fieldset>
  <div class="stack"><h2>KI einrichten</h2>
    <div><label class="lbl" for="vendor">Anbieter</label><select id="vendor" class="field">${Object.entries(VENDORS).map(([k, x]) => `<option value="${k}"${v === k ? " selected" : ""}>${esc(x.label)}</option>`).join("")}</select></div>
    ${VENDORS[v].needsBase ? `<div><label class="lbl" for="baseurl">Adresse (Base-URL)</label><input id="baseurl" class="field" value="${esc(memSettings.baseUrl || "")}" placeholder="https://api.groq.com/openai/v1" autocomplete="off"></div>` : ""}
    <div><label class="lbl" for="model">Modell</label><input id="model" class="field" value="${esc(memSettings.model || "")}" placeholder="${esc(VENDORS[v].model || "Modellname")}" autocomplete="off" spellcheck="false"><p class="hint">Leer lassen für den Standard (${esc(VENDORS[v].model || "bitte eintragen")}). Passe den Namen an, wenn dein Anbieter ihn geändert hat.</p></div>
    <div><label class="lbl" for="apikey">API-Schlüssel</label><input id="apikey" type="password" class="field" value="${esc(apiKey)}" placeholder="Dein persönlicher Schlüssel" autocomplete="off" spellcheck="false">
      <label class="ttsrow" style="padding:0"><input type="checkbox" id="remember"${memSettings.rememberKey ? " checked" : ""}> Auf diesem Gerät merken (sonst nur bis zum Schließen des Tabs)</label>
      <p class="hint">Der Schlüssel bleibt in deinem Browser und geht nur an den gewählten Anbieter. Nutze nach Möglichkeit einen Schlüssel mit Ausgabenlimit, und gib ihn nie auf fremden Geräten ein.</p></div>
  </div>
  ${ui.errors.settingsSaved ? `<p class="small" style="color:var(--accent-text)" role="status">Gespeichert.</p>` : ""}
  <p class="small muted">Diese Version läuft ohne Server direkt auf der Webseite. Sie speichert Übungen nur in deinem Browser.</p>`;
}

function renderModal() {
  const root = $("#modal-root");
  if (!ui.consent) { root.innerHTML = ""; return; }
  const s = getSession(ui.id);
  const items = ["Situationsbeschreibung, Beziehung, Ziel und schwierige Momente"];
  if (s.setup.experience || s.setup.writingSample) items.push("Erfahrungen und Schreibprobe");
  if (Object.values(s.answers).some(Boolean)) items.push("Antworten auf die Rückfragen");
  if (s.rounds.length) items.push(`Rollenspiel-Verläufe (${s.rounds.length})`);
  root.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="c-title"><div class="modal-card">
    <h2 id="c-title" style="font-size:18px">Verlauf an die KI übertragen?</h2>
    <p class="small muted">Diese Übung wurde bisher nur lokal mit dem Mock verarbeitet. Wenn du zur <b style="color:var(--ink)">KI</b> wechselst, werden bei der nächsten Anfrage folgende Inhalte an den von dir gewählten Anbieter gesendet:</p>
    <ul class="small">${items.map((i) => `<li>${esc(i)}</li>`).join("")}</ul>
    <button class="btn btn-primary" data-act="consent-yes">Übertragen und wechseln</button>
    <button class="btn" data-act="consent-no">Beim bisherigen Anbieter bleiben</button>
    <button class="btn btn-ghost" data-act="consent-new">Neue Übung ohne Verlauf starten</button>
  </div></div>`;
  $(".modal-card .btn-primary", root)?.focus();
}

function addMics() {
  let n = 0;
  document.querySelectorAll("#app textarea").forEach((ta) => {
    if (!ta.id) ta.id = "ta-auto-" + (++n);
    if (ta.parentElement.classList.contains("mic-wrap")) { if (!ta.parentElement.querySelector(".mic")) ta.parentElement.insertAdjacentHTML("beforeend", micBtn(ta.id, ta.disabled)); return; }
    const wrap = document.createElement("div"); wrap.className = "mic-wrap";
    ta.before(wrap); wrap.append(ta);
    wrap.insertAdjacentHTML("beforeend", micBtn(ta.id, ta.disabled));
  });
}
function render() {
  const app = $("#app");
  const views = { prep: viewPrep, prepRun: viewPrepRun, prepDossier: viewPrepDossier, prepDemo: viewPrepDemo, prepAfter: viewPrepAfter, home: viewHome, form: viewForm, session: viewSession, history: viewHistory, settings: viewSettings };
  app.innerHTML = (views[ui.view] || viewHome)();
  $("#nav-prep").setAttribute("aria-current", ui.view.startsWith("prep") ? "page" : "false");
  $("#nav-history").setAttribute("aria-current", ui.view === "history" ? "page" : "false");
  $("#nav-settings").setAttribute("aria-current", ui.view === "settings" ? "page" : "false");
  document.body.toggleAttribute("data-wide", ui.view === "home" || ui.view === "prep");
  addMics();
  syncMic();
  pAfterRender();
  renderModal();
  if (ui.view === "session") autoStart();
  const chat = $("#chat"); if (chat) chat.lastElementChild?.scrollIntoView({ block: "nearest" });
}

// ---------------- Aktionen ----------------
function createSession() {
  const f = ui.form;

    const prompt = isR ? pAIFbPrompt(P_CARDS[id.slice(2)], txt) : pAIProbePrompt(s, pQuestions(s.sc).find((x) => x.id === id), txt);
    ui.paibusy = id; ui.paierr = null; render();
    try { const out = await pAI(prompt); if (!out) throw 0; pUpdate(s.id, (x) => isR ? { ...x, aiF: { ...(x.aiF || {}), [id.slice(2)]: out } } : { ...x, ai: { ...(x.ai || {}), [id]: out } }, false); }
    catch { ui.paierr = id; }
    ui.paibusy = null; if (ui.pid === s.id && (pSteps(s)[(pGet(s.id).step || 0)] === id)) render(); return;
  }
  if (a === "revise") { ui.preveal = null; render(); return; }
  if (a === "reveal") { const cid = id.slice(2), r = pReplyScore((s.reacts || {})[cid], P_CARDS[cid]); ui.preveal = cid; pUpdate(s.id, (x) => ({ ...x, rsc: { ...x.rsc, [cid]: r.score } })); return; }
  if (a === "next") {
    if (id !== "ctx" && !id.startsWith("r:")) {
      const q = pQuestions(s.sc).find((x) => x.id === id), txt = (s.ans || {})[id] || "";
      if (ui.pprobe !== id && !(s.probed || {})[id]) {
        const p = pProbe(q, txt, { n: P_SCEN[s.sc].n, d: P_SCEN[s.sc].d });
        if (p) { ui.pprobe = id; pUpdate(s.id, (x) => ({ ...x, probed: { ...x.probed, [id]: true } })); return; }
      }
    }
    ui.pprobe = null; ui.preveal = null;
    if (i >= steps.length - 1) { pUpdate(s.id, (x) => ({ ...x, done: true, doneAt: x.doneAt || new Date().toISOString() })); go("prepDossier"); return; }
    pUpdate(s.id, (x) => ({ ...x, step: i + 1 })); window.scrollTo(0, 0); return;
  }
  if (a === "after") { go("prepAfter"); return; }
  if (a === "afset") { pUpdate(s.id, (x) => ({ ...x, after: { ...(x.after || {}), [d.k]: d.v } })); return; }
  if (a === "afsave") { pUpdate(s.id, (x) => ({ ...x, after: { ...(x.after || {}), savedAt: new Date().toISOString() } })); go("prepDossier"); window.scrollTo(0, 0); return; }
  if (a === "redo") { ui.pprobe = null; ui.preveal = null; pUpdate(s.id, (x) => ({ ...x, done: false, step: 1 })); go("prepRun"); return; }
  if (a === "print") { window.print(); return; }
  if (a === "copy") {
    const txt = pDossierText(s);
    try { await navigator.clipboard.writeText(txt); pFlash("Dossier in die Zwischenablage kopiert."); }
    catch { const ta = document.createElement("textarea"); ta.value = txt; document.body.append(ta); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch {} ta.remove(); pFlash(ok ? "Dossier kopiert." : "Kopieren wurde vom Browser blockiert. Nutze „Als Textdatei laden“."); }
    return;
  }
  if (a === "download") {
    const blob = new Blob([pDossierText(s)], { type: "text/plain;charset=utf-8" }), u = URL.createObjectURL(blob), l = document.createElement("a");
    l.href = u; l.download = "Gespraechs-Dossier.txt"; document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); pFlash("Textdatei geladen."); return;
  }
  if (a === "practice") {
    const A = s.ans || {}, S = P_SCEN[s.sc];
    ui.form = { ...blankForm(), scenario: S.map, difficulty: "schwer", counterpartLabel: (s.who || "").trim(), situation: (A.ziel1 || "").trim(), relationship: (A.geg1 || "").trim(), goal: (A.ziel2 || "").trim(), difficultMoments: S.react.map((r) => P_CARDS[r].line.replace(/[„“]/g, "")).slice(0, 3).join(" · "), experience: (A.geg2 || "").trim(), writingSample: "" };
    go("form"); return;
  }
});
document.addEventListener("keydown", (ev) => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches('.preview[data-pa="demo"]')) { ev.preventDefault(); ev.target.click(); } });
document.addEventListener("click", (ev) => { const b = ev.target.closest("[data-flow]"); if (!b) return; const i = +b.dataset.flow; ui.flow = ui.flow === i ? null : i; render(); const f = document.querySelector(".flowcard"); if (f) f.scrollIntoView({ block: "nearest", behavior: "smooth" }); });
document.addEventListener("input", (ev) => {
  const el = ev.target, d = el.dataset; if (!ui.pid) return;
  if ("paf" in d) { pUpdate(ui.pid, (s) => ({ ...s, after: { ...(s.after || {}), [d.paf]: el.value } }), false); return; }
  if (!(("pans" in d) || ("pwho" in d))) return;
  if ("pwho" in d) { pUpdate(ui.pid, (s) => ({ ...s, who: el.value }), false); return; }
  const id = d.pans, b = $('[data-pa="reveal"]');
  if (id.startsWith("r:")) { pUpdate(ui.pid, (s) => ({ ...s, reacts: { ...s.reacts, [id.slice(2)]: el.value } }), false); if (b) b.disabled = !el.value.trim(); }
  else pUpdate(ui.pid, (s) => ({ ...s, ans: { ...s.ans, [id]: el.value } }), false);
  if (!id.startsWith("r:")) { const ab = $('[data-pa="aiprobe"]'); if (ab && ui.paibusy !== id) ab.disabled = !el.value.trim(); }
});
document.addEventListener("change", (ev) => {
  if (ev.target.id === "p-imp") {
    const f = ev.target.files && ev.target.files[0]; if (!f) return;
    f.text().then((txt) => {
      try { const j = JSON.parse(txt); if (j.app !== "exit-coach-prep" || !Array.isArray(j.items)) throw 0; const ids = new Set(memPrep.map((x) => x.id)); let n = 0; for (const it of j.items) if (it && it.id && P_SCEN[it.sc] && !ids.has(it.id)) { memPrep.push(it); n++; } pSave(); ui.pmsg = n + " Vorbereitung" + (n === 1 ? "" : "en") + " eingelesen."; }
      catch { ui.pmsg = "Diese Datei ist keine gültige Exit-Coach-Sicherung."; }
      render();
    });
    return;
  }
  const el = ev.target, d = el.dataset; if (!ui.pid) return;
  if ("pocc" in d) pUpdate(ui.pid, (s) => { const o = new Set((s.after || {}).occ || []); el.checked ? o.add(d.pocc) : o.delete(d.pocc); return { ...s, after: { ...(s.after || {}), occ: [...o] } }; }, false);
  if ("ptimed" in d) pUpdate(ui.pid, (s) => ({ ...s, timed: el.checked }), false);
  if ("pcheck" in d) pUpdate(ui.pid, (s) => ({ ...s, check: { ...s.check, [d.pcheck]: el.checked } }), false);
});

// ---------------- Start ----------------
loadAll();
loadKey();
render();
})();
